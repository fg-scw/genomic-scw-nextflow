# Pipeline pin: nf-core/rnaseq 3.14.0 (kept for POC compatibility).
# Upgrade only after a representative Kapsule run validates the new release.
# Input and output are supplied by kubernetes/run/run.env for each run.

max_cpus: 7
max_memory: '56.GB'
max_time: '8.h'
fasta: /data/reference/GRCh38/Ensembl-110/genome.fa
gtf: /data/reference/GRCh38/Ensembl-110/genes.gtf
aligner: star_salmon
save_align_intermeds: false
save_unaligned: false
skip_markduplicates: false
skip_qc: false
min_mapped_reads: 5
# The demo subset is intentionally small; real datasets should use the pipeline default.
extra_salmon_quant_args: '--minAssignedFrags 1'
