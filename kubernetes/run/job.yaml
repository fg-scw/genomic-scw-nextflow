apiVersion: batch/v1
kind: Job
metadata:
  name: nextflow-REPLACE
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 86400
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: nextflow
      restartPolicy: Never
      nodeSelector:
        k8s.scaleway.com/pool-name: star-compute
      tolerations:
        - key: workload
          value: star-compute
          operator: Equal
          effect: NoSchedule
      initContainers:
        - name: check-reference
          image: nextflow/nextflow:25.10.4
          command: ["sh", "/config/reference.sh", "check", "/data/reference/GRCh38/Ensembl-110"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: reference
              mountPath: /data/reference
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: nextflow
          image: nextflow/nextflow:25.10.4
          imagePullPolicy: IfNotPresent
          command: ["sh", "/config/entrypoint.sh"]
          args:
            - -c
            - /config/nextflow.config
            - run
            - nf-core/rnaseq
            - -r
            - 3.14.0
            - -profile
            - $(NF_PROFILE)
            - -params-file
            - /config/params.yaml
            - --input
            - $(INPUT)
            - --outdir
            - $(OUTDIR)
            - -with-report
            - /data/workdir/report-$(RUN_ID).html
            - -with-timeline
            - /data/workdir/timeline-$(RUN_ID).html
            - -with-trace
            - /data/workdir/trace-$(RUN_ID).txt
          env:
            - name: RUN_ID
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: RUN_ID
            - name: INPUT
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: INPUT
            - name: OUTDIR
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: OUTDIR
            - name: RUN_RESUME
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: RUN_RESUME
            - name: NF_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: NF_PROFILE
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: nextflow-run-config
                  key: AWS_DEFAULT_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pipeline-s3-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pipeline-s3-credentials
                  key: secret-key
            - name: AWS_ENDPOINT_URL_S3
              valueFrom:
                secretKeyRef:
                  name: pipeline-s3-credentials
                  key: s3-endpoint
            - name: NXF_HOME
              value: /data/workdir/.nextflow
            - name: NXF_ANSI_LOG
              value: "false"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          workingDir: /data/workdir
          volumeMounts:
            - name: workdir
              mountPath: /data/workdir
            - name: reference
              mountPath: /data/reference
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: nf-workdir-pvc
        - name: reference
          persistentVolumeClaim:
            claimName: nf-reference-pvc
            readOnly: true
        - name: config
          configMap:
            name: nextflow-run-config
