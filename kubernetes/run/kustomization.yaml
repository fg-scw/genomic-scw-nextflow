apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bioinformatics

resources:
  - ../base
  - job.yaml

configMapGenerator:
  - name: nextflow-run-config
    behavior: merge
    envs:
      - run.env
    options:
      immutable: true

replacements:
  - source:
      kind: ConfigMap
      name: nextflow-run-config
      fieldPath: data.RUN_ID
    targets:
      - select:
          kind: Job
          name: nextflow-REPLACE
        fieldPaths:
          - metadata.name
        options:
          delimiter: '-'
          index: 1
